services:
  postgres:
    image: postgres:16-alpine
    container_name: clothing-store-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clothing_store
    volumes:
      - clothing_store_data:/var/lib/postgresql/data

volumes:
  clothing_store_data:
