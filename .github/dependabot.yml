version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # eslint-config-next targets ESLint 9; ESLint 10 breaks lint until Next ships support
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      types:
        patterns:
          - "@types/*"
          - "typescript"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Vitest 4 pulls rolldown native bindings; stay on Vitest 3 for portable CI/dev
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      nest:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
