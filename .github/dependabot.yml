version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      types:
        patterns:
          - "@types/*"
          - "typescript"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nest:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
