name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Prisma validate/generate only; no DB required in CI
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clothing_store?schema=public

jobs:
  lockfiles:
    name: Lockfiles (npm ci, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            backend/package-lock.json

      - name: Verify web lockfile
        working-directory: web
        run: npm ci

      - name: Verify backend lockfile
        working-directory: backend
        run: npm ci

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    needs: lockfiles
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend (validate, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: lockfiles
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
