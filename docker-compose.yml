# Local development only. Change POSTGRES_PASSWORD and API_KEY before any public deployment.
# Copy .env.example to .env to override defaults.

services:
  db:
    image: postgres:16-alpine
    container_name: clothing-store-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clothing_store}
    volumes:
      - clothing_store_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clothing-store-backend
    depends_on:
      - db
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clothing_store}?schema=public
      PORT: ${BACKEND_PORT:-4000}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: clothing-store-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      API_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-4000}
      API_KEY: ${API_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clothing_store}?schema=public
    command: ["npm", "run", "db:migrate"]
    profiles: ["tools"]

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clothing_store}?schema=public
    command: ["npm", "run", "db:seed"]
    profiles: ["tools"]

volumes:
  clothing_store_data:
