services:
  db:
    image: postgres:16-alpine
    container_name: clothing-store-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clothing_store
    volumes:
      - clothing_store_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clothing-store-backend
    depends_on:
      - db
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clothing_store?schema=public
      PORT: 4000
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: clothing-store-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      API_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3000:3000"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clothing_store?schema=public
    command: ["npm", "run", "db:migrate"]
    profiles: ["tools"]

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clothing_store?schema=public
    command: ["npm", "run", "db:seed"]
    profiles: ["tools"]

volumes:
  clothing_store_data:

